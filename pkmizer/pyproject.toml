[project]
name = "pkmizer"
version = "0.1.0"
description = "PKM Tools - GUI tool collection for Personal Knowledge Map"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "chardet>=5.2.0",
    "PySide6>=6.5.0",
    "requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pkmizer"]
